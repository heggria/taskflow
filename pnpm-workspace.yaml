# pnpm workspace — ten stable release packages + experimental CharterArc + private control + website.
# (Replaces the npm `workspaces` field in the root package.json; pnpm ignores
# that field and requires this file instead.)
packages:
  - "packages/taskflow-core"
  - "packages/charterarc"
  - "packages/taskflow-control"
  - "packages/taskflow-mcp-core"
  - "packages/taskflow-hosts"
  - "packages/pi-taskflow"
  - "packages/codex-taskflow"
  - "packages/claude-taskflow"
  - "packages/opencode-taskflow"
  - "packages/grok-taskflow"
  - "packages/hermes-taskflow"
  - "packages/taskflow-dsl"
  - "website"
overrides:
  baseline-browser-mapping: 2.11.0
  brace-expansion: 5.0.9
  # Dependabot alert #33 / GHSA-2v37-7h3g-55p8: nanoid < 3.3.18
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.4
  # Dependabot high/medium open alerts: undici < 8.9.0 (CRLF, cache, cookie, desync)
  undici: 8.9.0
allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
  sharp: true
minimumReleaseAgeExclude:
  - '@earendil-works/chord@1.0.0'
  - '@earendil-works/pi-agent-core@1.0.0'
  - '@earendil-works/pi-ai@1.0.0'
  - '@earendil-works/pi-codemode@1.0.0'
  - '@earendil-works/pi-coding-agent@1.0.0'
  - '@earendil-works/pi-mcp@1.0.0'
  - '@earendil-works/pi-telemetry@1.0.0'
  - '@earendil-works/pi-tui@1.0.0'
