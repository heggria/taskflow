# Paste under mcp_servers: in ~/.hermes/config.yaml (or $HERMES_HOME/config.yaml)
#
#   hermes mcp add taskflow -- npx -y -p hermes-taskflow@0.2.8 hermes-taskflow-mcp
#
# After adding, restart Hermes so tools are discovered as mcp_taskflow_*.

taskflow:
  command: "npx"
  args: ["-y", "-p", "hermes-taskflow@0.2.8", "hermes-taskflow-mcp"]
  env:
    # Required for mutating agent phases (terminal / file write / coding).
    PI_TASKFLOW_HERMES_UNSAFE_YOLO: "1"
    # Optional: cap child hermes tool loops (default 64).
    # PI_TASKFLOW_HERMES_MAX_TURNS: "64"
  timeout: 600
  connect_timeout: 60
