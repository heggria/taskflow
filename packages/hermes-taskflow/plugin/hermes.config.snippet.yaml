# Paste under mcp_servers: in ~/.hermes/config.yaml (or $HERMES_HOME/config.yaml)
#
# Preferred install (after Hermes host ships on npm):
#   Write this block, then: hermes mcp test taskflow
#
# Local monorepo dogfood:
#   command: node
#   args: ["/abs/path/to/packages/hermes-taskflow/dist/mcp/bin.js"]
#
# Footgun: prefer this YAML `env:` map. Do not rely on `hermes mcp add … --env`
# stuffing flags into the node argv list.
#
# 0.2.9 is the first release that includes hermes-taskflow.

taskflow:
  command: "npx"
  args: ["-y", "-p", "hermes-taskflow@0.3.0-beta.1", "hermes-taskflow-mcp"]
  env:
    # Uncomment for mutating agent phases (terminal / file write).
    # Leave unset for verify/plan/script-only flows.
    # PI_TASKFLOW_HERMES_UNSAFE_YOLO: "1"
    # Optional: allow network on read-only phases (default off).
    # PI_TASKFLOW_HERMES_READONLY_WEB: "1"
    # Optional: cap child hermes tool loops (default 64).
    # PI_TASKFLOW_HERMES_MAX_TURNS: "64"
  timeout: 600
  connect_timeout: 60
